<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Shortvideo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   หน้าเดียวจบ — ไม่มี scroll ของหน้า
   #app เป็น grid สูง 100dvh, body overflow:hidden
   พาเนลไหนข้อมูลยาวให้ scroll "ข้างใน" ตัวเองเท่านั้น (ทุก child ของ grid
   ต้องมี min-height:0 ไม่งั้นมันดันหน้าให้ยาวแทนที่จะ scroll ข้างใน)

   สไตล์: ระบบเดียวกับ macOS/iOS — ฟอนต์ระบบ (SF Pro ถ้ามี ไม่มีใช้ Inter)
   ตัวไทยมาจาก Noto Sans Thai ใน stack เดียวกัน จึงไม่ต้องแยกคลาส .th อีก
   สี "ใกล้เทา" ทั้งหมด ยกเว้นสีสถานะ (น้ำเงิน/เขียว/ส้ม/แดง) ที่ใช้เฉพาะจุด
   ============================================================ */
:root{
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Noto Sans Thai", system-ui, sans-serif;
  --bg:#f5f5f7; --card:#ffffff; --card2:#f2f2f7; --hair:rgba(0,0,0,.08); --hair2:rgba(0,0,0,.05);
  --ink:#1d1d1f; --dim:#6e6e73; --dim2:#aeaeb2;
  --blue:#0071e3; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --purple:#af52de; --teal:#5ac8fa;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --r:14px; --rs:9px;
  --screen:#000;
  /* แกรเดียนต์ — ใช้ชุดเดียวทั้งหน้าให้ดูเป็นระบบ ไม่ใช่สีสุ่ม */
  --g1:#0a84ff; --g2:#5e5ce6; --g3:#bf5af2; --g4:#ff2d55; --g5:#30d158; --g6:#64d2ff;
  --grad:linear-gradient(135deg, var(--g1), var(--g2) 55%, var(--g3));
  --grad-ok:linear-gradient(135deg, var(--g5), var(--g6));
  --grad-warn:linear-gradient(135deg, #ff9f0a, #ff2d55);
  --grad-bad:linear-gradient(135deg, #ff453a, #bf5af2);
  --bg-mesh:
    radial-gradient(60% 50% at 8% 0%,   rgba(10,132,255,.22), transparent 70%),
    radial-gradient(50% 45% at 100% 10%, rgba(191,90,242,.20), transparent 70%),
    radial-gradient(55% 55% at 55% 105%, rgba(100,210,255,.18), transparent 70%),
    radial-gradient(35% 35% at 20% 90%,  rgba(255,45,85,.10), transparent 70%);
}
/* ธีม: data-theme บน <html> = light|dark บังคับ, ไม่มี = ตามระบบ (ปุ่มใน header เก็บลง localStorage) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --hair:rgba(255,255,255,.1); --hair2:rgba(255,255,255,.06);
    --ink:#f5f5f7; --dim:#98989d; --dim2:#636366;
    --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2; --teal:#64d2ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --screen:#0a0a0a;
    --bg-mesh:
      radial-gradient(60% 50% at 8% 0%,   rgba(10,132,255,.28), transparent 70%),
      radial-gradient(50% 45% at 100% 10%, rgba(191,90,242,.26), transparent 70%),
      radial-gradient(55% 55% at 55% 105%, rgba(100,210,255,.16), transparent 70%),
      radial-gradient(35% 35% at 20% 90%,  rgba(255,45,85,.14), transparent 70%);
  }
}
:root[data-theme="dark"]{
    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --hair:rgba(255,255,255,.1); --hair2:rgba(255,255,255,.06);
    --ink:#f5f5f7; --dim:#98989d; --dim2:#636366;
    --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2; --teal:#64d2ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --screen:#0a0a0a;
    --bg-mesh:
      radial-gradient(60% 50% at 8% 0%,   rgba(10,132,255,.28), transparent 70%),
      radial-gradient(50% 45% at 100% 10%, rgba(191,90,242,.26), transparent 70%),
      radial-gradient(55% 55% at 55% 105%, rgba(100,210,255,.16), transparent 70%),
      radial-gradient(35% 35% at 20% 90%,  rgba(255,45,85,.14), transparent 70%);
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* button/label ตั้ง display เอง ต้องบังคับให้ hidden ชนะ */
html,body{margin:0; height:100%}
body{
  background:var(--bg-mesh), var(--bg); background-attachment:fixed; color:var(--ink); font-family:var(--font); font-size:13px;
  line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
.th{font-family:var(--font)}   /* คงชื่อคลาสเดิมไว้ให้ markup ที่มี */
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-0.02em}
.card{background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%); border-radius:var(--r); box-shadow:var(--shadow), inset 0 0 0 1px var(--hair2);
  min-height:0; min-width:0}
.scroll{overflow:auto; min-height:0; overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:10px; height:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--hair); border-radius:10px; border:3px solid transparent; background-clip:content-box}
.scroll::-webkit-scrollbar-track{background:transparent}

#app{display:grid; grid-template-rows:auto 1fr; height:100dvh; gap:14px; padding:14px 16px 16px}

/* ---------- header (glass) ---------- */
header{display:flex; align-items:center; gap:14px; padding:10px 18px; flex-wrap:wrap;
  background:color-mix(in srgb, var(--card) 72%, transparent); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px); border-radius:var(--r); box-shadow:var(--shadow)}
header h1{font-size:17px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
header .sub{color:var(--dim); font-size:12px; display:flex; align-items:center; gap:7px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--dim2)}
.dot.on{background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent)}
.dot.off{background:var(--red); box-shadow:0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent)}
.spacer{flex:1}
.stat{color:var(--dim); font-size:12px; white-space:nowrap}
.stat b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
button, a.btn{font-family:var(--font); font-size:13px; font-weight:500; padding:8px 14px; cursor:pointer;
  border:0; border-radius:980px; background:var(--card2); color:var(--ink); line-height:1.2;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:transform .12s ease, filter .12s ease, opacity .12s}
button:hover, a.btn:hover{filter:brightness(.96)}
button:active:not(:disabled), a.btn:active{transform:scale(.97)}
button:disabled{opacity:.4; cursor:not-allowed}
button.primary, a.btn.primary{background:var(--grad); color:#fff; box-shadow:0 4px 14px rgba(94,92,230,.35)}
button.success{background:var(--grad-ok); color:#fff; box-shadow:0 4px 14px rgba(48,209,88,.3)}
button.danger{background:var(--grad-bad); color:#fff; box-shadow:0 4px 14px rgba(255,69,58,.3)}
button.warn{background:var(--grad-warn); color:#fff; box-shadow:0 4px 14px rgba(255,159,10,.3)}
button:hover.primary, a.btn:hover.primary, button:hover.success, button:hover.danger, button:hover.warn{filter:brightness(1.06)}
button.sm, a.btn.sm{font-size:12px; padding:6px 11px}
button.ghost{background:transparent; color:var(--blue)}
button.icon{padding:6px; width:28px; height:28px; justify-content:center; border-radius:50%; font-size:14px; color:var(--dim)}

.tseg{display:flex; gap:2px; padding:3px; background:var(--card2); border-radius:980px}
.tseg button{background:transparent; padding:4px 10px; font-size:12px; color:var(--dim); border-radius:980px; min-width:34px; justify-content:center}
.tseg button.on{background:var(--grad); color:#fff; box-shadow:0 2px 8px rgba(94,92,230,.35)}

/* ---------- layout ---------- */
main{display:grid; grid-template-columns:290px minmax(0,1fr) 420px; gap:14px; min-height:0}
.col{display:grid; gap:14px; min-height:0; min-width:0}
.panelhead{display:flex; align-items:center; gap:8px; padding:14px 16px 8px; font-size:12px; font-weight:600;
  color:var(--dim); text-transform:uppercase; letter-spacing:.04em}
.panelhead .r{margin-left:auto; font-weight:500; text-transform:none; letter-spacing:0}

/* ---------- run list ---------- */
.run{display:grid; grid-template-columns:10px 1fr; gap:10px; padding:11px 14px; margin:0 8px 4px; cursor:pointer;
  border-radius:var(--rs); transition:background .12s}
.run:hover{background:var(--card2)}
.run.sel{background:linear-gradient(135deg, color-mix(in srgb, var(--g1) 16%, transparent), color-mix(in srgb, var(--g3) 14%, transparent))}
.run .sd{width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--dim2)}
.run .sd.run_{background:var(--grad); animation:pulse 1.6s ease-in-out infinite}
.run .sd.gate{background:var(--grad-warn)} .run .sd.ok{background:var(--grad-ok)} .run .sd.bad{background:var(--grad-bad)}
@keyframes pulse{50%{opacity:.35}}
.run .brief{font-size:13px; line-height:1.4; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden}
.run .meta{font-size:11px; color:var(--dim); margin-top:3px; font-variant-numeric:tabular-nums}
.run .meta .st{text-transform:capitalize}
.run .fmt{display:inline-block; font-size:9px; font-weight:700; padding:0 6px; border-radius:980px; background:var(--grad); color:#fff; margin-right:4px; vertical-align:1px}
.empty{color:var(--dim); text-align:center; padding:28px 12px; font-size:13px; line-height:1.6}

/* ---------- pill / badge ---------- */
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:980px; font-size:11px; font-weight:600;
  background:var(--card2); color:var(--dim); text-transform:capitalize}
.pill.run_{background:var(--grad); color:#fff}
.pill.gate{background:var(--grad-warn); color:#fff}
.pill.ok{background:var(--grad-ok); color:#fff}
.pill.bad{background:var(--grad-bad); color:#fff}

/* ---------- pipeline stepper ---------- */
.status{padding:14px 18px 12px}
.status .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.status .title{font-size:16px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  background:linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--ink) 55%, var(--g2))); -webkit-background-clip:text; background-clip:text; color:transparent}
.pipe{display:grid; grid-template-columns:repeat(16, minmax(0,1fr)); gap:0; position:relative; margin:4px 0 14px}
.step{display:flex; flex-direction:column; align-items:center; gap:5px; position:relative; font-size:9.5px;
  color:var(--dim2); text-align:center; line-height:1.1}
.step::before{content:''; position:absolute; top:5px; left:-50%; width:100%; height:2px; background:var(--hair)}
.step:first-child::before{display:none}
.step i{width:12px; height:12px; border-radius:50%; background:var(--card); border:2px solid var(--hair); position:relative; z-index:1}
.step.done{color:var(--dim)} .step.done i{background:var(--grad-ok); border-color:transparent}
.step.done::before{background:var(--grad-ok)}
.step.now{color:var(--g2); font-weight:600} .step.now i{background:var(--grad); border-color:transparent;
  box-shadow:0 0 0 4px color-mix(in srgb, var(--g2) 25%, transparent); animation:pulse 1.4s ease-in-out infinite}
.step.now::before{background:linear-gradient(90deg, var(--g5), var(--g1))}
.step.gate i{border-radius:3px}
.step.bad{color:var(--red); font-weight:600} .step.bad i{background:var(--grad-bad); border-color:transparent}
.meters{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.meter .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:6px}
.meter .lbl b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.bar{height:6px; border-radius:6px; background:var(--card2); overflow:hidden}
.bar i{display:block; height:100%; border-radius:6px; background:var(--grad); transition:width .4s ease}
.bar i.w{background:var(--grad-warn)} .bar i.d{background:var(--grad-bad)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{font-size:11px; color:var(--dim); padding:3px 9px; border-radius:980px; font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg, color-mix(in srgb, var(--g1) 10%, var(--card2)), color-mix(in srgb, var(--g3) 10%, var(--card2)))}
.chip b{color:var(--ink); font-weight:600}
.err{margin-top:12px; padding:10px 12px; border-radius:var(--rs); font-size:12px; line-height:1.5;
  background:color-mix(in srgb, var(--red) 10%, transparent); color:var(--red); word-break:break-word;
  max-height:72px; overflow:auto}

/* ---------- preview ---------- */
.stage{display:grid; grid-template-rows:minmax(0,1fr) auto auto; min-height:0; gap:12px; padding:0 16px 16px; flex:1}
/* วิดีโอ/ภาพวางแบบ absolute + object-fit:contain — max-height:100% ใน grid ที่ซ้อน
   อยู่ใน flex คำนวณเป็น "ไม่จำกัด" ทำให้ภาพ 9:16 ถูกตัดด้านล่าง (บั๊กเดิมของหน้าเก่า) */
.screen{position:relative; min-height:0; background:var(--screen); border-radius:var(--r); overflow:hidden}
.screen video,.screen img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block}
.screen .none{position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); font-size:13px; text-align:center; line-height:1.8; padding:20px}
.filmstrip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; flex:none}
.filmstrip::-webkit-scrollbar{height:8px}
.fr{flex:none; width:58px; cursor:pointer; border-radius:var(--rs); overflow:hidden; position:relative;
  background:var(--card2); outline:2px solid transparent; outline-offset:2px; transition:outline-color .12s}
.fr:hover{outline-color:var(--hair)}
.fr.sel{outline-color:var(--g2); box-shadow:0 0 0 4px color-mix(in srgb, var(--g2) 22%, transparent)}
.fr img{width:100%; height:96px; object-fit:cover; display:block}
.fr .n{position:absolute; left:5px; bottom:5px; font-size:10px; font-weight:600; color:#fff; padding:1px 6px;
  border-radius:980px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px)}
.fr .vid{height:96px; display:grid; place-items:center; color:var(--blue); font-size:11px; font-weight:600; line-height:1.3; text-align:center}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.actions .q{font-size:12px; color:var(--dim); margin-right:4px}
.actions .q.bad{color:var(--red)}

/* ---------- segmented control + tabs ---------- */
.seg{display:flex; gap:2px; padding:3px; margin:12px 16px 8px; background:var(--card2); border-radius:10px; flex:none}
.seg button{flex:1; background:transparent; border-radius:8px; padding:6px 4px; font-size:12px; color:var(--dim); font-weight:500;
  justify-content:center; gap:5px}
.seg button.on{background:var(--grad); color:#fff; box-shadow:0 2px 8px rgba(94,92,230,.35)}
.seg button.on .c{color:rgba(255,255,255,.75)}
.seg button .c{font-size:10px; color:var(--dim2); font-variant-numeric:tabular-nums}
.tabbody{padding:4px 16px 16px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; margin-bottom:14px}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.section{font-size:11px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin:14px 0 8px}
.beat{padding:11px 12px; margin-bottom:6px; background:var(--card2); border-radius:var(--rs); line-height:1.5}
.beat .role{display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.beat .dur{float:right; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
.beat .spk{color:var(--blue); font-weight:600}
.beat .vis{color:var(--dim); font-size:12px; margin-top:4px}
.row{padding:10px 12px; margin-bottom:6px; background:var(--card2); border-radius:var(--rs); cursor:pointer; line-height:1.5; font-size:13px;
  outline:2px solid transparent; transition:outline-color .12s}
.row:hover{outline-color:var(--hair)} .row.sel{outline-color:var(--blue)}
.row .t{color:var(--blue); font-weight:600; font-variant-numeric:tabular-nums}
.row .mono{color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px}
.row .tag{font-size:10px; font-weight:600; padding:1px 7px; border-radius:980px; margin-left:4px; vertical-align:1px}
.tag.img{background:var(--grad-ok); color:#fff}
.tag.clip{background:var(--grad); color:#fff}
.tag.re{background:var(--grad-bad); color:#fff}
.row .p{color:var(--dim); font-size:12px; margin-top:4px}
.ev{display:grid; grid-template-columns:82px 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--hair2); font-size:12.5px; line-height:1.5}
.ev .s{color:var(--dim); font-size:11px; font-weight:600; padding-top:2px}
.ev.warn .m{color:var(--orange)} .ev.error .m{color:var(--red)}
.issue{padding:10px 12px; margin-bottom:6px; background:var(--card2); border-radius:var(--rs); font-size:13px}
.issue .sev{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-right:6px}
.issue .sev.block{color:var(--red)} .issue .sev.warn{color:var(--orange)}
.issue .fix{color:var(--dim); font-size:12px; margin-top:3px}

/* ---------- post tab ---------- */
.acct{display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:6px; background:var(--card2); border-radius:var(--rs); cursor:pointer}
.acct input[type=checkbox]{width:18px; height:18px; accent-color:var(--blue); margin:0}
.plat{display:inline-block; min-width:64px; padding:2px 8px; font-size:10px; font-weight:700; text-align:center; border-radius:980px; color:#fff; text-transform:uppercase; letter-spacing:.03em}
.plat.youtube{background:linear-gradient(135deg,#ff2d55,#ff9f0a)} .plat.facebook{background:linear-gradient(135deg,#0866ff,#5e5ce6)}
.plat.tiktok{background:linear-gradient(135deg,#111,#3a3a3c); box-shadow:inset 0 0 0 1px var(--hair)}
.acct .h{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.acct .note{font-size:10px; color:var(--orange); font-weight:600}
select{font-family:var(--font); font-size:13px; padding:7px 30px 7px 12px; border-radius:980px; border:0; background:var(--card2); color:var(--ink);
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position:calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size:5px 5px; background-repeat:no-repeat}
.hist{padding:10px 12px; margin-bottom:6px; background:var(--card2); border-radius:var(--rs); font-size:13px; line-height:1.5}
.hist a{color:var(--blue); text-decoration:none; word-break:break-all; font-size:12px}
.hist .e{color:var(--red); font-size:12px; margin-top:3px; word-break:break-word}

/* ---------- modal (sheet) ---------- */
.modal{position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  display:grid; place-items:center; z-index:50; padding:16px}
.modal[hidden]{display:none}
.modal .sheet{width:min(520px,100%); padding:22px 22px 18px; background:var(--card); border-radius:18px; box-shadow:0 24px 80px rgba(0,0,0,.35)}
.modal h2{font-size:19px; margin-bottom:14px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
label{display:block; font-size:12px; font-weight:600; color:var(--dim); margin:12px 0 6px}
textarea,input[type=text],input[type=number],input:not([type]){font-family:var(--font); font-size:14px; width:100%; padding:10px 12px; border-radius:10px;
  border:1px solid var(--hair); background:var(--card2); color:var(--ink); outline:none; transition:box-shadow .12s}
textarea:focus,input:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--g2) 30%, transparent); border-color:var(--g2)}
textarea{resize:vertical; min-height:96px}
.modal .foot{display:flex; gap:8px; justify-content:flex-end; margin-top:18px}
.check{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink); font-weight:400; margin-top:10px}
.check input{width:18px; height:18px; accent-color:var(--blue); margin:0}
.hint{font-size:12px; color:var(--dim); margin-top:10px; line-height:1.5}

/* ---------- narrow ---------- */
@media(max-width:1200px){
  main{grid-template-columns:230px minmax(0,1fr)}
  .col.right{display:none}
  .col.right.show{display:grid; position:fixed; inset:70px 16px 16px; z-index:40}
}
@media(max-width:820px){
  .step span{display:none}            /* 16 ป้ายไม่มีทางพอบนจอโทรศัพท์ — โชว์เฉพาะขั้นปัจจุบัน */
  .step.now span,.step.bad span{display:block; position:absolute; top:16px; white-space:nowrap}
  .pipe{margin-bottom:26px}
  main{grid-template-columns:minmax(0,1fr)}
  .col.left{display:none}
  .col.left.show{display:grid; position:fixed; inset:70px 16px 16px; z-index:40}
  #app{padding:10px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Shortvideo</h1>
    <span class="sub"><span class="dot" id="led"></span><span id="health">Connecting…</span></span>
    <div class="spacer"></div>
    <span class="stat">Runs <b id="nruns">0</b></span>
    <span class="stat">Spent <b id="spent">$0</b></span>
    <div class="tseg" id="theme" title="Theme">
      <button data-theme="auto" title="ตามระบบ">Auto</button>
      <button data-theme="light" title="สว่าง">☀︎</button>
      <button data-theme="dark" title="มืด">☾</button>
    </div>
    <button class="sm" id="runstoggle" hidden>Runs</button>
    <button class="sm" id="tabtoggle" hidden>Details</button>
    <button class="primary sm" id="newbtn">+ New Task</button>
  </header>

  <main>
    <aside class="card col left" id="left" style="grid-template-rows:auto minmax(0,1fr)">
      <div class="panelhead">Runs</div>
      <div class="scroll" id="runs" style="padding-bottom:8px"></div>
    </aside>

    <!-- กลาง: สถานะ + ผลลัพธ์ที่ดูได้จริง -->
    <div class="col" style="grid-template-rows:auto minmax(0,1fr)">
      <div class="card" id="statusbox"></div>
      <div class="card" style="display:flex; flex-direction:column">
        <div class="panelhead">Preview <span class="r" id="prevmeta"></span></div>
        <div class="stage" id="stage"></div>
      </div>
    </div>

    <!-- ขวา: ข้อมูลครบ แยกเป็นแท็บแทนการเลื่อนยาว -->
    <div class="col right" id="right" style="grid-template-rows:minmax(0,1fr)">
      <div class="card" style="display:flex; flex-direction:column">
        <div class="seg" id="tabs"></div>
        <div class="scroll" id="tabhost" style="flex:1"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h2>New Task</h2>
    <label>Format</label>
    <div class="seg" id="fmtseg" style="margin:0 0 4px"></div>
    <label>Render</label>
    <div class="seg" id="rndseg" style="margin:0 0 4px"></div>
    <label>Brief</label>
    <textarea id="brief" rows="4" placeholder="อยากเล่าเรื่องอะไร ให้ใครดู…"></textarea>
    <label>Product photos <span style="font-weight:400; color:var(--dim2)">(โฆษณา — แนบได้หลายรูป)</span></label>
    <input id="products" type="file" accept="image/*" multiple style="font-size:12px; padding:8px">
    <div id="prodprev" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
      <div><label>Art style</label><select id="style" style="width:100%; border-radius:10px"></select></div>
      <div><label>Target duration (seconds)</label><input id="dur" type="number" value="30" min="10" max="180"></div>
    </div>
    <div class="foot">
      <button id="cancel">Cancel</button>
      <button class="primary" id="create">Start</button>
    </div>
  </div>
</div>

<div class="modal" id="tmodal" hidden>
  <div class="sheet">
    <h2>Add Account</h2>
    <label>Platform</label>
    <select id="tplat" style="width:100%; border-radius:10px">
      <option value="youtube">YouTube Shorts</option>
      <option value="facebook">Facebook Reels (Page)</option>
      <option value="tiktok">TikTok</option>
    </select>
    <label>Account / handle</label>
    <input id="thandle" placeholder="ชื่อช่อง / เพจ / @handle">
    <label>Access token</label>
    <input id="ttoken" placeholder="YouTube: OAuth token (youtube.upload) · Facebook: Page token · TikTok: user token (video.publish)">
    <label id="lrefresh">Refresh token (optional)</label>
    <input id="trefresh" placeholder="">
    <label id="lpage" hidden>Facebook Page ID</label>
    <input id="tpage" placeholder="" hidden>
    <label id="taudited" class="check" hidden>
      <input id="taud" type="checkbox"> TikTok app ผ่าน audit แล้ว (โพสต์ public ได้)
    </label>
    <div class="hint">token ถูกเก็บในฐานข้อมูลของคุณเอง ไม่ส่งไปที่อื่นนอกจากแพลตฟอร์มนั้น ๆ ตอนโพสต์</div>
    <div class="foot">
      <button id="tcancel">Cancel</button>
      <button class="primary" id="tcreate">Save</button>
    </div>
  </div>
</div>

<script>
// ---------------- theme ----------------
function applyTheme(t){
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else { delete document.documentElement.dataset.theme; t = 'auto'; }
  document.querySelectorAll('#theme button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  try { localStorage.setItem('theme', t); } catch(e){}
}
document.getElementById('theme').addEventListener('click', e => {
  const b = e.target.closest('[data-theme]'); if (b) applyTheme(b.dataset.theme);
});
try { applyTheme(localStorage.getItem('theme') || 'auto'); } catch(e){ applyTheme('auto'); }

const STEPS = [
  ['draft','Draft'],['concept','Idea'],['story_draft','Script'],['story_review','Gate 0'],
  ['shot_planning','Shots'],['character_design','Cast'],
  ['keyframing','Frames'],['animatic','Animatic'],['storyboard_review','Gate 1'],
  ['video_gen','Video'],['final_render','Render'],['qc','QC'],['final_review','Gate 2'],
  ['approved','Approved'],['publishing','Posting'],['published','Live'],
];
const GATES = new Set(['story_review','storyboard_review','final_review']);
const DEAD  = new Set(['failed','rejected']);
const $ = s => document.querySelector(s);

let sel = null;      // run ที่เลือก
let tab = 'script';  // แท็บฝั่งขวา
let postSel = new Set();      // target ที่ติ๊กไว้ในแท็บ POST — เก็บนอก DOM เพราะแท็บถูกวาดใหม่เมื่อข้อมูลเปลี่ยน
let postPrivacy = 'private';
let targets = [], publishes = [];
let frame = null;    // keyframe ที่กำลังดู — null = ดูวิดีโอ
let lastRun = null;  // กันรีเซ็ต state ที่ผู้ใช้เลือกไว้ตอน poll
let lastStageKey = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (p, o) => { const r = await fetch(p, o); if (!r.ok) throw new Error(r.status + ' ' + await r.text()); return r.json(); };
const f2 = n => (n || 0).toFixed(2);
const nice = st => String(st || '').replace(/_/g, ' ');

function kind(st, gate){
  if (DEAD.has(st)) return 'bad';
  if (st === 'published' || st === 'approved') return 'ok';
  if (gate) return 'gate';
  return 'run_';
}
const pill = (st, gate) => '<span class="pill ' + kind(st, gate) + '">' + esc(nice(st)) + '</span>';

function pipeline(state){
  const i = STEPS.findIndex(s => s[0] === state);
  const dead = DEAD.has(state);
  return '<div class="pipe">' + STEPS.map(([k, label], n) => {
    let c = 'step';
    if (GATES.has(k)) c += ' gate';
    if (i >= 0 && n < i) c += ' done';
    else if (i >= 0 && n === i) c += ' now';
    if (dead && n === STEPS.length - 1) c = 'step bad';
    const text = (dead && n === STEPS.length - 1) ? esc(nice(state)) : label;
    return '<div class="' + c + '"><i></i><span>' + text + '</span></div>';
  }).join('') + '</div>';
}

function bar(val, max, mode){
  const raw = max ? val / max : 0, ratio = Math.min(1, raw);
  // budget: เตือนเมื่อใกล้เพดาน — length: ครบเป้าคือดี เตือนเฉพาะเมื่อเกินมาก
  const cls = mode === 'len' ? (raw > 1.25 ? 'd' : raw > 1.12 ? 'w' : '')
                             : (raw > 0.9 ? 'd' : raw > 0.7 ? 'w' : '');
  return '<div class="bar"><i class="' + cls + '" style="width:' + (ratio * 100).toFixed(1) + '%"></i></div>';
}

// ---------------- รายการ run ----------------
async function loadRuns(){
  let rs;
  try { rs = await api('/runs?limit=60'); } catch(e){ return; }
  $('#nruns').textContent = rs.length;
  $('#spent').textContent = '$' + rs.reduce((a, r) => a + (r.cost_usd || 0), 0).toFixed(2);
  const list = rs.length ? rs.map(r =>
    '<div class="run' + (r.id === sel ? ' sel' : '') + '" data-id="' + r.id + '">' +
      '<span class="sd ' + kind(r.state, r.at_gate) + '"></span>' +
      '<div><div class="brief">' + esc(r.brief || '(ไม่มีบรีฟ)') + '</div>' +
      '<div class="meta">' + (r.format === 'cartoon' ? '<span class="fmt">Cartoon</span>' : '') + (r.render === 'avatar' ? '<span class="fmt" style="background:var(--grad-ok)">Avatar</span>' : '') +
      '<span class="st">' + esc(nice(r.state)) + '</span> · ' + esc(r.id.slice(0, 8)) + ' · $' + (r.cost_usd || 0).toFixed(2) + '</div></div>' +
    '</div>').join('')
    : '<div class="empty">ยังไม่มีงาน<br>กด <b>+ New Task</b> เพื่อเริ่ม</div>';
  const box = $('#runs');
  if (box.dataset.sig !== list){
    const top = box.scrollTop;
    box.innerHTML = list;
    box.dataset.sig = list;
    box.scrollTop = top;
  }
  if (!sel && rs.length){ sel = rs[0].id; loadDetail(); }
}

// ---------------- แถบสถานะบนสุดของคอลัมน์กลาง ----------------
function renderStatus(d){
  const cap = d.budget_cap_usd || 5;
  const dur = d.duration_s || 0, tgt = d.target_duration_s || 0;
  const title = (d.story && d.story.title) || d.brief || '—';
  let h = '<div class="status">';
  h += '<div class="top"><div class="title">' + esc(title) + '</div>' + pill(d.state, d.at_gate) + '</div>';
  h += pipeline(d.state);
  h += '<div class="meters">' +
    '<div class="meter"><div class="lbl"><span>Budget</span><b>$' + (d.cost_usd || 0).toFixed(3) + ' / $' + cap + '</b></div>' + bar(d.cost_usd || 0, cap) + '</div>' +
    '<div class="meter"><div class="lbl"><span>Length</span><b>' + (dur ? f2(dur) + 's' : '—') + (tgt ? ' / ' + tgt + 's' : '') + '</b></div>' + bar(dur, tgt || dur || 1, 'len') + '</div>' +
    '</div>';
  const cbs = d.cost_by_stage || {};
  const keys = Object.keys(cbs).filter(k => cbs[k].usd > 0);
  if (keys.length){
    h += '<div class="chips">' + keys.map(k => '<span class="chip">' + esc(k) + ' <b>$' + cbs[k].usd.toFixed(3) + '</b>' +
      (cbs[k].calls > 1 ? ' ×' + cbs[k].calls : '') + '</span>').join('') + '</div>';
  }
  if (d.error) h += '<div class="err">' + esc(d.error) + '</div>';
  h += '</div>';
  const box = $('#statusbox');
  if (box.dataset.sig !== h){ box.innerHTML = h; box.dataset.sig = h; }
}

// ---------------- จอกลาง: วิดีโอ / keyframe + ปุ่ม gate ----------------
// วาดจอกลางใหม่ทุกรอบ poll ไม่ได้ — <video> จะถูกสร้างใหม่แล้วเด้งกลับไป 0:00
// ทุก 2.5 วินาที ดูพรีวิวไม่ได้เลย จึงเทียบ "ลายเซ็น" ของสิ่งที่จะแสดงก่อน
function stageKey(d){
  return [d.id, d.state, d.failed_state, frame, d.animatic, d.final, (d.characters || []).length, d.at_gate,
          (d.shots || []).map(s => (s.keyframe_path ? 1 : 0) + (s.clip_path ? 2 : 0)).join('')].join('|');
}

function renderStage(d){
  const key = stageKey(d);
  if (key === lastStageKey) return;
  lastStageKey = key;

  const shots = d.shots || [];
  const g1 = d.state === 'storyboard_review';
  let screen;
  if (frame !== null && shots[frame] && shots[frame].keyframe_path){
    // shot ที่มีคลิปแล้วเล่นคลิปจริง (ดูได้แม้ run ล้มก่อน final) ไม่งั้นโชว์ภาพนิ่ง
    screen = shots[frame].clip_path
      ? '<video controls autoplay src="/runs/' + sel + '/clip?idx=' + frame + '"></video>'
      : '<img src="/runs/' + sel + '/image?kind=keyframe&idx=' + frame + '" alt="">';
  } else if (d.final){
    screen = '<video controls src="/runs/' + sel + '/video?which=final"></video>';
  } else if (d.animatic){
    screen = '<video controls src="/runs/' + sel + '/video?which=animatic"></video>';
  } else if (shots.some(s => s.keyframe_path)){
    const i = shots.findIndex(s => s.keyframe_path);
    screen = '<img src="/runs/' + sel + '/image?kind=keyframe&idx=' + i + '" alt="">';
  } else if ((d.characters || []).length){
    screen = '<img src="/runs/' + sel + '/image?kind=character&idx=0" alt="">';
  } else {
    screen = '<div class="none">ยังไม่มีภาพ<br><span style="color:var(--dim2)">' + esc(nice(d.state)) + '</span></div>';
  }

  let strip = '';
  const withImg = shots.map((s, i) => [s, i]).filter(([s]) => s.keyframe_path);
  if (withImg.length){
    strip = '<div class="filmstrip">' +
      (d.animatic || d.final ? '<div class="fr' + (frame === null ? ' sel' : '') + '" data-frame="video">' +
        '<div class="vid">▶<br>' + (d.final ? 'Final' : 'Animatic') + '</div></div>' : '') +
      withImg.map(([s, i]) => '<div class="fr' + (frame === i ? ' sel' : '') + '" data-frame="' + i + '">' +
        '<img loading="lazy" src="/runs/' + sel + '/image?kind=keyframe&idx=' + i + '" alt="">' +
        '<span class="n">' + (i + 1) + (s.clip_path ? ' ▶' : '') + '</span></div>').join('') +
      '</div>';
  } else if ((d.characters || []).length){
    // ภาพอ้างอิงตัวละคร — portrait + design sheet ต่อตัว (ทุกใบถูกใช้เป็น reference)
    strip = '<div class="filmstrip">' +
      d.characters.map((c, i) =>
        '<div class="fr" title="' + esc(c.name) + '">' +
        '<img loading="lazy" src="/runs/' + sel + '/image?kind=character&idx=' + i + '" alt="">' +
        '<span class="n">' + esc(c.name) + '</span></div>' +
        '<div class="fr" title="' + esc(c.name) + ' — design sheet">' +
        '<img loading="lazy" src="/runs/' + sel + '/image?kind=sheet&idx=' + i + '" alt="">' +
        '<span class="n">sheet</span></div>').join('') +
      '</div>';
  }
  if (d.n_products){
    strip += '<div class="filmstrip">' + Array.from({length: d.n_products}, (_, i) =>
      '<div class="fr" title="product"><img loading="lazy" src="/runs/' + sel + '/image?kind=product&idx=' + i + '" alt="">' +
      '<span class="n">product</span></div>').join('') + '</div>';
  }

  let act = '';
  if (d.state === 'failed' && d.failed_state){
    act += '<span class="q bad">ล้มที่ ' + esc(nice(d.failed_state)) + '</span>' +
      '<button class="warn sm" data-act="resume">Resume from ' + esc(nice(d.failed_state)) + '</button>';
  }
  if (d.at_gate){
    act += '<span class="q">รออนุมัติ</span>' +
      (g1 ? '<button class="success sm" data-act="approve" data-animatic="0">Approve · generate video</button>' +
            '<button class="sm" data-act="approve" data-animatic="1">Approve as animatic</button>'
          : '<button class="success sm" data-act="approve" data-animatic="0">Approve</button>') +
      '<button class="danger sm" data-act="reject">Reject</button>';
  }
  if (d.animatic || d.final){
    // ลิงก์ตรง ไม่ผ่าน fetch — เบราว์เซอร์จัดการดาวน์โหลดไฟล์ใหญ่เอง
    act += (act ? '<span class="spacer"></span>' : '') +
      (d.final ? '<a class="btn primary sm" href="/runs/' + sel + '/video?which=final&download=1">⇩ Download</a>' : '') +
      (d.animatic ? '<a class="btn sm" href="/runs/' + sel + '/video?which=animatic&download=1">⇩ Animatic</a>' : '') +
      ((d.state === 'approved' || d.state === 'published') ? '<button class="sm" data-gotab="post">Post…</button>' : '');
  }
  const actions = act ? '<div class="actions">' + act + '</div>' : '';

  $('#prevmeta').textContent =
    (frame !== null && shots[frame] ? 'Shot ' + (frame + 1) + ' of ' + shots.length + (shots[frame].clip_path ? ' · clip' : ' · keyframe')
     : d.final ? 'Final' : d.animatic ? 'Animatic' : withImg.length ? 'Keyframe' : (d.characters || []).length ? 'Cast' : '');
  $('#stage').innerHTML = '<div class="screen">' + screen + '</div>' + strip + actions;
}

// ---------------- ฝั่งขวา: แท็บ ----------------
function renderTabs(d, ev){
  const shots = d.shots || [];
  const beats = (d.story && d.story.beats) || [];
  const issues = (d.qc_report && d.qc_report.issues) || [];
  const defs = [
    ['script', 'Script', beats.length],
    ['shots',  'Shots',  shots.length],
    ['qc',     'QC',     d.qc_report ? issues.length : null],
    ['post',   'Post',   publishes.length || null],
    ['log',    'Log',    ev.length],
  ];
  const segs = defs.map(([k, label, n]) =>
    '<button class="' + (tab === k ? 'on' : '') + '" data-tab="' + k + '">' + label +
    (n === null ? '' : '<span class="c">' + n + '</span>') + '</button>').join('');
  const tb = $('#tabs');
  if (tb.dataset.sig !== segs){ tb.innerHTML = segs; tb.dataset.sig = segs; }

  let h = '';
  if (tab === 'script'){
    h += '<div class="kv">' +
      '<dt>Brief</dt><dd>' + esc(d.brief || '—') + '</dd>' +
      (d.story ? '<dt>Title</dt><dd><b>' + esc(d.story.title) + '</b></dd>' +
                 '<dt>Angle</dt><dd>' + esc(d.story.angle || '—') + '</dd>' +
                 '<dt>CTA</dt><dd>' + esc(d.story.cta || '—') + '</dd>' : '') +
      '</div>';
    const cast = (d.story && d.story.characters) || [];
    if (cast.length){
      h += '<div class="section">Cast</div>';
      h += cast.map(c => '<div class="beat"><b>' + esc(c.name) + '</b> <span style="color:var(--dim)">— ' + esc(c.role) + '</span>' +
          '<div class="vis">' + esc(c.appearance_en) + '</div></div>').join('');
    }
    if (beats.length) h += '<div class="section">Beats</div>';
    h += beats.length ? beats.map(b =>
      '<div class="beat"><span class="role">' + esc(b.role) + '</span><span class="dur">' + (b.duration_s || 0) + 's</span>' +
      (b.dialogue ? '<div><span class="spk">' + esc(b.speaker || '?') + ':</span> ' + esc(b.dialogue) + '</div>'
                  : '<div style="color:var(--dim)">(ไม่มีบทพูด)</div>') +
      '<div class="vis">' + esc(b.visual_intent || '') + '</div>' +
      '</div>').join('') : '<div class="empty">ยังไม่มีบท</div>';
    if (d.post_meta){
      h += '<div class="section">Post metadata</div>' +
        '<div class="beat"><b>' + esc(d.post_meta.title_yt || '') + '</b>' +
        '<div class="vis">' + esc(d.post_meta.caption_th || '') + '</div>' +
        '<div class="vis" style="color:var(--blue)">' + esc((d.post_meta.hashtags || []).join(' ')) + '</div></div>';
    }
  }

  else if (tab === 'shots'){
    h = shots.length ? shots.map((s, i) =>
      '<div class="row' + (frame === i ? ' sel' : '') + '" data-frame="' + i + '">' +
      '<span class="t">' + esc(s.id) + '</span> <span class="mono">' + f2(s.start_s) + '→' + f2(s.end_s) + 's (' + f2((s.end_s || 0) - (s.start_s || 0)) + 's)</span> ' +
      '<span style="color:var(--purple); font-size:12px">' + esc(s.plan.composition) + ' · ' + esc(s.plan.camera_move) + '</span>' +
      (s.keyframe_path ? '<span class="tag img">IMG</span>' : '') +
      (s.clip_path ? '<span class="tag clip">CLIP</span>' : '') +
      (s.regen_count ? '<span class="tag re">↻' + s.regen_count + '</span>' : '') +
      ((s.keyframe_cost_usd || s.clip_cost_usd) ? ' <span class="mono">$' +
        ((s.keyframe_cost_usd || 0) + (s.clip_cost_usd || 0)).toFixed(3) +
        (s.clip_model ? ' · ' + esc(s.clip_model.split('/').pop()) : '') + '</span>' : '') +
      '<div class="p">' + esc(s.plan.image_prompt) + '</div>' +
      '</div>').join('') : '<div class="empty">ยังไม่มี shot</div>';
  }

  else if (tab === 'qc'){
    if (!d.qc_report) h = '<div class="empty">ยังไม่ถึงขั้น QC</div>';
    else {
      const v = d.qc_report.verdict;
      h = '<div style="margin:6px 0 12px; display:flex; align-items:center; gap:8px">Verdict ' +
        '<span class="pill ' + (v === 'pass' ? 'ok' : v === 'fail' ? 'bad' : 'gate') + '">' + esc(v) + '</span></div>' +
        (issues.length ? issues.map(i =>
          '<div class="issue"><span class="sev ' + esc(i.severity) + '">' + esc(i.severity) + '</span>' +
          '<b>' + esc(i.code) + '</b>' + (i.shot_id ? ' <span class="mono" style="color:var(--dim)">' + esc(i.shot_id) + '</span>' : '') +
          '<div>' + esc(i.detail) + '</div>' +
          (i.suggested_fix ? '<div class="fix">→ ' + esc(i.suggested_fix) + '</div>' : '') +
          '</div>').join('') : '<div style="color:var(--green)">✓ ไม่พบปัญหา</div>');
    }
  }

  else if (tab === 'post'){
    const canPost = d.state === 'approved' || d.state === 'published';
    h = '<div class="section" style="margin-top:6px">Accounts</div>';
    h += targets.length ? targets.map(t =>
      '<label class="acct"><input type="checkbox" data-target="' + t.id + '"' + (postSel.has(t.id) ? ' checked' : '') + '>' +
      '<span class="plat ' + esc(t.platform) + '">' + esc(t.platform) + '</span>' +
      '<span class="h">' + esc(t.account_handle) + '</span>' +
      (t.platform === 'tiktok' && !t.audited ? '<span class="note">self-only</span>' : '') +
      '<button class="icon" data-deltarget="' + t.id + '" title="ลบบัญชี">×</button>' +
      '</label>').join('')
      : '<div class="empty">ยังไม่มีบัญชี</div>';
    h += '<div class="actions" style="margin:10px 0 4px">' +
      '<select id="privacy">' + ['private','unlisted','public'].map(v =>
        '<option value="' + v + '"' + (postPrivacy === v ? ' selected' : '') + '>' + v[0].toUpperCase() + v.slice(1) + '</option>').join('') + '</select>' +
      '<button class="primary sm" data-act="publish"' + (canPost && postSel.size ? '' : ' disabled') + '>Post now</button>' +
      '<button class="sm" id="addtarget">+ Add account</button>' +
      '</div>';
    if (!canPost) h += '<div class="hint">โพสต์ได้หลังผ่าน Gate 2 (state = approved)</div>';
    h += '<div class="section">History</div>';
    h += publishes.length ? publishes.map(a =>
      '<div class="hist"><span class="plat ' + esc(a.platform) + '">' + esc(a.platform) + '</span> ' +
      '<span class="pill ' + (a.status === 'published' ? 'ok' : a.status === 'failed' ? 'bad' : 'gate') + '">' + esc(a.status) + '</span> ' +
      '<span style="color:var(--dim)">' + esc(a.account_handle) + '</span>' +
      (a.url ? '<div><a href="' + esc(a.url) + '" target="_blank">' + esc(a.url) + '</a></div>'
             : a.external_post_id ? '<div class="mono" style="color:var(--dim); font-size:12px">id ' + esc(a.external_post_id) + '</div>' : '') +
      (a.error ? '<div class="e">' + esc(a.error) + '</div>' : '') +
      '</div>').join('') : '<div class="empty">ยังไม่เคยโพสต์</div>';
  }

  else {
    h = ev.length ? ev.slice().reverse().map(e =>
      '<div class="ev ' + esc(e.level) + '">' +
      '<span class="s">' + esc(e.stage || '-') + '</span>' +
      '<span class="m">' + esc(e.message) + '</span></div>').join('')
      : '<div class="empty">ยังไม่มี event</div>';
  }
  const host = $('#tabhost');
  const body = '<div class="tabbody">' + h + '</div>';
  if (host.dataset.sig !== body){
    const top = host.scrollTop;      // อ่านค้างอยู่ตรงไหน ให้อยู่ตรงนั้นต่อ
    host.innerHTML = body;
    host.dataset.sig = body;
    host.scrollTop = top;
  }
}

async function loadDetail(){
  if (!sel){ $('#stage').innerHTML = '<div class="screen"><div class="none">เลือกงานจากรายการด้านซ้าย</div></div>'; return; }
  let d, ev;
  try {
    [d, ev] = await Promise.all([api('/runs/' + sel), api('/runs/' + sel + '/events')]);
    if (tab === 'post' || ['approved','publishing','published'].includes(d.state)){
      [targets, publishes] = await Promise.all([api('/targets'), api('/runs/' + sel + '/publishes')]);
    }
  }
  catch(e){ $('#statusbox').innerHTML = '<div class="status"><div class="err">' + esc(e.message) + '</div></div>'; return; }
  // เปลี่ยน run = ล้าง keyframe ที่ค้างอยู่ ไม่งั้นจะชี้ไป shot ของ run เก่า
  if (lastRun !== d.id){ frame = null; lastRun = d.id; }
  renderStatus(d); renderStage(d); renderTabs(d, ev);
}

// ---------------- events ----------------
$('#runs').addEventListener('click', e => {
  const el = e.target.closest('.run'); if (!el) return;
  sel = el.dataset.id; frame = null; $('#left').classList.remove('show'); loadRuns(); loadDetail();
});

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; loadDetail();
});

// คลิกฟิล์มสตริปหรือแถว shot = สลับภาพบนจอกลาง
document.addEventListener('click', async e => {
  const fr = e.target.closest('[data-frame]');
  if (fr){ frame = fr.dataset.frame === 'video' ? null : +fr.dataset.frame; loadDetail(); return; }

  const gt = e.target.closest('[data-gotab]');
  if (gt){ tab = gt.dataset.gotab; $('#right').classList.add('show'); loadDetail(); return; }
  const cb = e.target.closest('input[data-target]');
  if (cb){ cb.checked ? postSel.add(cb.dataset.target) : postSel.delete(cb.dataset.target); loadDetail(); return; }
  const del = e.target.closest('[data-deltarget]');
  if (del){
    e.preventDefault();
    if (!confirm('ลบบัญชีนี้?')) return;
    try { await api('/targets/' + del.dataset.deltarget, {method:'DELETE'}); postSel.delete(del.dataset.deltarget); }
    catch(err){ alert(err.message); }
    loadDetail(); return;
  }
  if (e.target.id === 'addtarget'){ $('#tmodal').hidden = false; return; }

  const b = e.target.closest('button[data-act]');
  if (!b) return;
  b.disabled = true;
  try {
    const body = {reviewer:'ui', notes:''};
    if (b.dataset.act === 'resume'){
      await api('/runs/' + sel + '/resume', {method:'POST'});
    } else if (b.dataset.act === 'publish'){
      await api('/runs/' + sel + '/publish', {method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({target_ids: [...postSel], privacy: postPrivacy})});
    } else if (b.dataset.act === 'approve'){
      await api('/runs/' + sel + '/approve', {method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({...body, animatic_only: b.dataset.animatic === '1'})});
    } else {
      await api('/runs/' + sel + '/reject', {method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({...body, reason_code:'quality'})});
    }
  } catch(err){ alert(err.message); }
  setTimeout(() => { loadRuns(); loadDetail(); }, 600);
});

document.addEventListener('change', e => {
  if (e.target.id === 'privacy') postPrivacy = e.target.value;
  if (e.target.id === 'tplat'){
    const p = e.target.value;
    $('#tpage').hidden = $('#lpage').hidden = p !== 'facebook';
    $('#trefresh').hidden = $('#lrefresh').hidden = p === 'facebook';
    $('#taudited').hidden = p !== 'tiktok';
  }
});
$('#tcancel').onclick = () => { $('#tmodal').hidden = true; };
$('#tcreate').onclick = async () => {
  const platform = $('#tplat').value;
  const body = {platform, account_handle: $('#thandle').value.trim(), access_token: $('#ttoken').value.trim(),
                refresh_token: $('#trefresh').value.trim() || null,
                audited: $('#taud').checked, config: {}};
  if (platform === 'facebook') body.config.page_id = $('#tpage').value.trim();
  if (!body.account_handle || !body.access_token) return alert('ต้องมีชื่อบัญชีและ token');
  try {
    const t = await api('/targets', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
    postSel.add(t.id); $('#tmodal').hidden = true;
    for (const id of ['thandle','ttoken','trefresh','tpage']) $('#' + id).value = '';
    tab = 'post'; loadDetail();
  } catch(err){ alert(err.message); }
};

// ---------------- New Task: format + style ----------------
let newFormat = 'content', newRender = 'scene';
const FORMAT_DEFAULT_STYLE = {content: 'live', cartoon: 'pixar3d'};
const BRIEF_HINT = {
  content: 'อยากเล่าเรื่องอะไร ให้ใครดู…',
  cartoon: 'พล็อตคร่าว ๆ: ตัวละครเป็นใคร อยากได้อะไร แล้วเจออะไร (ระบบจะคิดมุกและหักมุมให้) เช่น "แมวอ้วนพยายามขโมยปลาย่างจากหมาที่หลับอยู่"',
};
async function loadFormats(){
  try {
    const f = await api('/formats');
    $('#fmtseg').innerHTML = f.formats.map(x =>
      '<button type="button" data-fmt="' + x.id + '" class="' + (x.id === newFormat ? 'on' : '') + '">' + esc(x.label) + '</button>').join('');
    $('#style').innerHTML = f.styles.map(x => '<option value="' + x.id + '">' + esc(x.label) + '</option>').join('');
    $('#rndseg').innerHTML = f.renders.map(x =>
      '<button type="button" data-rnd="' + x.id + '" class="' + (x.id === newRender ? 'on' : '') + '" title="' + esc(x.label) + '">' +
      esc(x.label.split(' — ')[0]) + '</button>').join('');
    $('#style').value = FORMAT_DEFAULT_STYLE[newFormat];
    $('#brief').placeholder = BRIEF_HINT[newFormat];
  } catch(e){}
}
$('#fmtseg').addEventListener('click', e => {
  const b = e.target.closest('[data-fmt]'); if (!b) return;
  newFormat = b.dataset.fmt;
  document.querySelectorAll('#fmtseg button').forEach(x => x.classList.toggle('on', x.dataset.fmt === newFormat));
  $('#style').value = FORMAT_DEFAULT_STYLE[newFormat] || 'live';
  $('#brief').placeholder = BRIEF_HINT[newFormat] || '';
});
$('#rndseg').addEventListener('click', e => {
  const b = e.target.closest('[data-rnd]'); if (!b) return;
  newRender = b.dataset.rnd;
  document.querySelectorAll('#rndseg button').forEach(x => x.classList.toggle('on', x.dataset.rnd === newRender));
});
$('#products').addEventListener('change', () => {
  const files = [...$('#products').files];
  $('#prodprev').innerHTML = files.map(f => '<img src="' + URL.createObjectURL(f) + '" style="width:48px; height:48px; object-fit:cover; border-radius:8px">').join('');
});
loadFormats();

$('#newbtn').onclick = () => { $('#modal').hidden = false; $('#brief').focus(); };
$('#cancel').onclick = () => { $('#modal').hidden = true; };
$('#create').onclick = async () => {
  const brief = $('#brief').value.trim(); if (!brief) return;
  try {
    // multipart เสมอ — ภาพสินค้าไปพร้อมกับ task ตั้งแต่แรก (บทต้องเห็นภาพ)
    const fd = new FormData();
    fd.append('brief', brief); fd.append('target_duration_s', +$('#dur').value || 30);
    fd.append('format', newFormat); fd.append('render', newRender);
    if ($('#style').value) fd.append('style_preset', $('#style').value);
    for (const f of $('#products').files) fd.append('products', f);
    const r = await api('/tasks/upload', {method:'POST', body: fd});
    sel = r.run_id; frame = null; $('#modal').hidden = true; $('#brief').value = '';
    $('#products').value = ''; $('#prodprev').innerHTML = '';
    loadRuns(); loadDetail();
  } catch(e){ alert(e.message); }
};
// Esc ปิด sheet
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#modal').hidden = true; $('#tmodal').hidden = true; } });

// จอแคบ: สลับให้พาเนลข้อมูลทับขึ้นมาแทนการดันหน้าให้ยาว
const mq = matchMedia('(max-width:1200px)'), mq2 = matchMedia('(max-width:820px)');
function syncNarrow(){
  $('#tabtoggle').hidden = !mq.matches; if (!mq.matches) $('#right').classList.remove('show');
  $('#runstoggle').hidden = !mq2.matches; if (!mq2.matches) $('#left').classList.remove('show');
}
mq.addEventListener('change', syncNarrow); mq2.addEventListener('change', syncNarrow); syncNarrow();
$('#tabtoggle').onclick = () => { $('#right').classList.toggle('show'); $('#left').classList.remove('show'); };
$('#runstoggle').onclick = () => { $('#left').classList.toggle('show'); $('#right').classList.remove('show'); };

async function health(){
  try { const h = await api('/healthz');
    $('#led').className = 'dot on'; $('#health').textContent = h.ok ? 'Online' : 'Degraded';
  } catch(e){ $('#led').className = 'dot off'; $('#health').textContent = 'Offline'; }
}

health(); loadRuns(); loadDetail();
setInterval(() => { health(); loadRuns(); if (sel) loadDetail(); }, 2500);
</script>
</body>
